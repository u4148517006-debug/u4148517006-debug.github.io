<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4指仮想キーボード - ML特徴量抽出版</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      background-color: #ffffff; font-family: sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    .btn {
      position: absolute; bottom: 24px; width: 56px; height: 56px;
      color: white; border: none; border-radius: 50%; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 10;
      touch-action: none;
    }
    #fab { right: 24px; background-color: #4CAF50; }
    #fab.locked { background-color: #f44336; }
    
    #june-btn { right: 96px; background-color: #9C27B0; font-size: 14px; font-weight: bold; }
    #june-btn.active { background-color: #FF5722; }

    #info-panel {
      position: absolute; top: 16px; left: 16px;
      background: rgba(255,255,255,0.8); padding: 12px;
      border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      pointer-events: none; font-size: 12px; z-index: 10;
      font-family: monospace; line-height: 1.4;
    }
    #odai-display {
      position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%);
      font-size: 96px; font-weight: bold; color: #E91E63;
      pointer-events: none; z-index: 5; display: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <button id="june-btn" class="btn">6月</button>
  <button id="fab" class="btn">🔓</button>
  
  <div id="info-panel">
    <div>ステータス: <span id="status-text">待機中</span></div>
    <div style="margin-top: 8px; font-weight: bold;">【抽出された特徴量】</div>
    <div id="ml-features">指のデータ未確定</div>
  </div>

  <div id="odai-display">あ</div>

  <script>
    // ==========================================
    // 🛠️ 設定：GASのURL
    // ==========================================
    const GAS_URL = "";

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fab = document.getElementById('fab');
    const juneBtn = document.getElementById('june-btn');
    const statusText = document.getElementById('status-text');
    const mlFeaturesText = document.getElementById('ml-features');
    const odaiDisplay = document.getElementById('odai-display');

    function resize() {
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // キーボード定数
    const keySize = 41;
    const waterSize = 20;
    const stay = { x: 0, y: 0 };
    const moveUp = { x: keySize * -0.23, y: keySize * 2.2 };
    const moveDown = { x: keySize * 0.23, y: keySize * -2.2 };
    const moveLeft = { x: keySize * -2.14, y: 0 };
    const threeKeys = [stay, moveUp, moveDown, { x: moveUp.x * 2, y: moveUp.y * 2 }];

    const keysPositions = [
      [stay, moveUp, moveDown, moveLeft, { x: moveLeft.x + moveUp.x, y: moveLeft.y + moveUp.y }, { x: moveLeft.x + moveDown.x, y: moveLeft.y + moveDown.y }, { x: moveUp.x * 2, y: moveUp.y * 2 }],
      threeKeys, threeKeys, threeKeys
    ];
    const keysNames = [
      ["J", "U", "M", "H", "Y", "N", "Offset"],
      ["K", "I", ",", "Offset"],
      ["L", "O", ".", "Offset"],
      [";", "P", "?", "Offset"]
    ];
    const centerAdjust = [
      { x: keySize * -3.7, y: keySize * -0.2 },
      { x: keySize * -1.3, y: keySize * -1.3 },
      { x: keySize * 1.3,  y: keySize * -1.3 },
      { x: keySize * 3.5,  y: keySize * -0.2 }
    ];

    // 状態管理
    let touches = {};        
    let trails = {};         
    let stableFingers = [];
    let stableCenter = null;
    let adjustedCenters = [];
    let fourAngles = [];
    let isLocked = false; 

    // 機械学習用：ジェスチャ開始時と離した瞬間の生の座標
    let strokeStarts = [null, null, null, null];
    let strokeEnds = [null, null, null, null];
    let isRecordingGesture = false;

    // モード管理
    let isJuneMode = false;
    let juneTimer = null;
    const odaiList = ["あ", "い", "う", "え", "お", "か", "き", "く", "け", "こ"];
    let odaiIndex = 0;
    let currentOdai = "";

    // 幾何計算
    function lerp(a, b, t) { return { x: a.x * (1 - t) + b.x * t, y: a.y * (1 - t) + b.y * t }; }
    function distance(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
    function archer(a, b) {
      let dis = distance(a, b);
      let speed = Math.pow(dis / (4.3 * keySize), 4) / 58;
      return lerp(a, b, speed > 5 ? 5 : speed);
    }
    function mean(pts) {
      let sum = pts.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
      return { x: sum.x / pts.length, y: sum.y / pts.length };
    }
    function sortByPrincipalAxis(pts) {
      const c = mean(pts);
      let sxx = 0, syy = 0, sxy = 0;
      pts.forEach(p => {
        let dx = p.x - c.x; let dy = p.y - c.y;
        sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
      });
      let theta = 0.5 * Math.atan2(2 * sxy, sxx - syy);
      let axis = { x: Math.cos(theta), y: Math.sin(theta) };
      return [...pts].sort((a, b) => ((a.x - c.x) * axis.x + (a.y - c.y) * axis.y) - ((b.x - c.x) * axis.x + (b.y - c.y) * axis.y));
    }
    function circleCenterFrom2Points(a, b) {
      let vx = b.x - a.x; let vy = b.y - a.y;
      let r1 = { x: (vx * Math.cos(Math.PI*0.3) - vy * Math.sin(Math.PI*0.3)) * 1.35, y: (vx * Math.sin(Math.PI*0.3) + vy * Math.cos(Math.PI*0.3)) * 1.35 };
      let e1 = { x: a.x + r1.x, y: a.y + r1.y };
      return (e1.y > a.y) ? e1 : { x: a.x + (vx * Math.cos(-Math.PI*0.3) - vy * Math.sin(-Math.PI*0.3)) * 1.35, y: a.y + (vx * Math.sin(-Math.PI*0.3) + vy * Math.cos(-Math.PI*0.3)) * 1.35 };
    }

    // 🛠️ 【新ロジック】最も動いた指3本の「最終着地点の相対座標」を抽出する
    function extractMLFeatures(starts, ends, baseFingers, angles) {
      let fingerMovements = [];

      for (let i = 0; i < 4; i++) {
        if (!starts[i] || !ends[i]) {
          fingerMovements.push({ index: i, distance: 0, rx: 0, ry: 0 });
          continue;
        }

        // 始点から終点までの単純な移動距離（ソートの基準用）
        let totalDist = Math.hypot(ends[i].x - starts[i].x, ends[i].y - starts[i].y);

        // 終点（着地点）が、ホームポジション(baseFingers)からどれだけズレているかのベクトル
        let dx = ends[i].x - baseFingers[i].x;
        let dy = ends[i].y - baseFingers[i].y;
        let angle = angles[i];

        // キーボードの傾きに合わせて最終着地点のズレ量を回転補正（ローカル座標化）
        let rx = dx * Math.cos(angle) + dy * Math.sin(angle);
        let ry = dx * Math.sin(angle) - dy * Math.cos(angle);

        fingerMovements.push({
          index: i,        // 指の識別ID (0:人差し指, 1:中指, 2:薬指, 3:小指)
          distance: totalDist,
          rx: parseFloat(rx.toFixed(2)), // ホームからの最終Xズレ
          ry: parseFloat(ry.toFixed(2))  // ホームからの最終Yズレ
        });
      }

      // 移動距離(distance)が大きい順番にソート
      fingerMovements.sort((a, b) => b.distance - a.distance);

      // 上位3本を抽出
      return fingerMovements.slice(0, 3);
    }

    // スプシ送信（特徴量ベクトルを送信）
    async function sendToSpreadsheet(char, features) {
      if (!GAS_URL || GAS_URL.trim() === "" || GAS_URL.startsWith("ここに")) {
        console.log(`GAS_URL未設定。スキップしました。[お題: ${char}] 特徴量:`, features);
        return;
      }
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ char: char, features: features }) // 3本分の特徴量データをそのまま送信
        });
        const result = await response.json();
        console.log("スプシ送信結果:", result);
      } catch (error) {
        console.error("スプシ送信エラー:", error);
      }
    }

    // タッチイベント処理
    function handleTouch(e) {
      let currentTouches = {};
      Array.from(e.touches).forEach(t => {
        currentTouches[t.identifier] = { x: t.clientX, y: t.clientY };
        if (!trails[t.identifier]) trails[t.identifier] = [];
        trails[t.identifier].push({ x: t.clientX, y: t.clientY });
        if (trails[t.identifier].length > 25) trails[t.identifier].shift();
      });
      touches = currentTouches;

      let fingerCount = Object.keys(touches).length;
      
      // 指が触れた瞬間（ジェスチャー開始）の座標を保存
      if ((isLocked || isJuneMode) && fingerCount > 0 && !isRecordingGesture) {
        isRecordingGesture = true;
        statusText.innerText = isJuneMode ? `お題【${currentOdai}】収集中...` : "タイピング検知中...";
        
        let pointsArray = Object.values(touches);
        if (pointsArray.length >= 4) {
          let sorted = sortByPrincipalAxis(pointsArray);
          for(let i=0; i<4; i++) strokeStarts[i] = { x: sorted[i].x, y: sorted[i].y };
        } else {
          for(let i=0; i<4; i++) strokeStarts[i] = { x: stableFingers[i].x, y: stableFingers[i].y };
        }
      }

      // 動いている最中の現在の最新位置を常に終了座標の候補として上書き
      if (isRecordingGesture && fingerCount > 0) {
        let pointsArray = Object.values(touches);
        if (pointsArray.length >= 4) {
          let sorted = sortByPrincipalAxis(pointsArray);
          for(let i=0; i<4; i++) strokeEnds[i] = { x: sorted[i].x, y: sorted[i].y };
        }
      }

      // すべての指が完全に離れた瞬間（デッドストップ）
      if (fingerCount === 0 && isRecordingGesture) {
        isRecordingGesture = false;
        statusText.innerText = isJuneMode ? "6月モード稼働中" : "固定中 (待機)";
        
        // 特徴量（トップ3本の最終座標）を抽出
        let features = extractMLFeatures(strokeStarts, strokeEnds, stableFingers, fourAngles);
        
        // パネル表示用に整形
        mlFeaturesText.innerHTML = features.map((f, rank) => 
          `${rank+1}位: 指${f.index} (移動:${Math.round(f.distance)}px)<br>&nbsp;&nbsp;&nbsp;最終座標➔ X:${f.rx}, Y:${f.ry}`
        ).join('<br>');

        // 6月モードならデータを送信
        if (isJuneMode) {
          sendToSpreadsheet(currentOdai, features);
        }

        // 初期化
        strokeStarts = [null, null, null, null];
        strokeEnds = [null, null, null, null];
      }

      Object.keys(trails).forEach(id => { if (!touches[id]) delete trails[id]; });
    }

    window.addEventListener('touchstart', handleTouch);
    window.addEventListener('touchmove', (e) => { handleTouch(e); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchend', handleTouch);

    // 固定ボタン
    fab.addEventListener('touchstart', (e) => {
      e.stopPropagation(); 
      if (stableFingers.length === 4) {
        isLocked = !isLocked;
        fab.className = isLocked ? "btn locked" : "btn";
        fab.innerText = isLocked ? "🔒" : "🔓";
        statusText.innerText = isLocked ? "固定中 (待機)" : "追従中";
      }
    });

    // 6月モードボタン
    juneBtn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      if (stableFingers.length !== 4) return; 

      isJuneMode = !isJuneMode;
      if (isJuneMode) {
        juneBtn.className = "btn active";
        odaiDisplay.style.display = "block";
        statusText.innerText = "6月モード稼働中";
        
        isLocked = true;
        fab.className = "btn locked"; fab.innerText = "🔒";

        odaiIndex = 0;
        nextOdai();
        juneTimer = setInterval(nextOdai, 1000);
      } else {
        juneBtn.className = "btn";
        odaiDisplay.style.display = "none";
        statusText.innerText = "追従中";
        isLocked = false;
        fab.className = "btn"; fab.innerText = "🔓";
        clearInterval(juneTimer);
      }
    });

    function nextOdai() {
      currentOdai = odaiList[odaiIndex];
      odaiDisplay.innerText = currentOdai;
      odaiIndex++;
      if (odaiIndex >= odaiList.length) odaiIndex = 0;
    }

    // メインループ
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let points = Object.values(touches);

      if (!isLocked && points.length >= 4) {
        let sortedPoints = sortByPrincipalAxis(points);
        let realFingers = sortedPoints.slice(0, 4);
        let realCenter = circleCenterFrom2Points(realFingers[0], realFingers[3]);

        if (stableFingers.length === 0 || !stableCenter) {
          stableFingers = realFingers.map(p => ({...p})); stableCenter = realCenter;
          adjustedCenters = [stableCenter, stableCenter, stableCenter, stableCenter];
          let p = Math.atan2(adjustedCenters[1].y - stableFingers[1].y, adjustedCenters[1].x - stableFingers[1].x) + Math.PI / 2;
          fourAngles = [p, p, p, p];
        }

        for (let i = 0; i < 4; i++) stableFingers[i] = archer(stableFingers[i], realFingers[i]);
        stableCenter = archer(stableCenter, realCenter);
        let centerAngle = Math.atan2(stableFingers[1].y - stableCenter.y, stableFingers[1].x - stableCenter.x) + Math.PI / 2;

        for (let i = 0; i < 4; i++) {
          let u = centerAdjust[i];
          adjustedCenters[i] = { 
            x: stableCenter.x + (u.x * Math.cos(centerAngle) - u.y * Math.sin(centerAngle)), 
            y: stableCenter.y + (u.x * Math.sin(centerAngle) + u.y * Math.cos(centerAngle)) 
          };
          fourAngles[i] = Math.atan2(stableFingers[i].y - adjustedCenters[i].y, stableFingers[i].x - adjustedCenters[i].x) + Math.PI / 2;
        }
      }

      if (stableFingers.length === 4) {
        // 骨組み線
        ctx.strokeStyle = "grey"; ctx.lineWidth = 3;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath(); ctx.moveTo(stableFingers[i].x, stableFingers[i].y);
          ctx.lineTo(adjustedCenters[i].x, adjustedCenters[i].y); ctx.stroke();
        }

        // キー描画
        for (let i = 0; i < 4; i++) {
          let pos = stableFingers[i]; let angle = fourAngles[i];
          keysPositions[i].forEach((offset, m) => {
            let keyPos = { 
              x: pos.x + (offset.x * Math.cos(angle) + offset.y * Math.sin(angle)), 
              y: pos.y + (offset.x * Math.sin(angle) - offset.y * Math.cos(angle)) 
            };
            ctx.save(); ctx.translate(keyPos.x, keyPos.y); ctx.rotate(angle);
            ctx.fillStyle = isLocked ? "#f5f5f5" : "#ffffff"; ctx.strokeStyle = "#000000"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.roundRect(-keySize, -keySize, keySize * 2, keySize * 2, 10); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#000000";
            let label = keysNames[i][m] || "";
            if (m === keysNames[i].length - 1) label = isLocked ? "待機" : "追従中";
            ctx.font = `${m === keysNames[i].length - 1 ? keySize/4 : keySize/2}px sans-serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(label, 0, 0);
            ctx.restore();
          });
        }

        if (stableCenter) {
          ctx.strokeStyle = isLocked ? "#f44336" : "#000000"; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.arc(stableCenter.x, stableCenter.y, 150, 0, Math.PI * 2); ctx.stroke();
        }
      }

      // 視覚エフェクト
      Object.values(trails).forEach(pointsList => {
        pointsList.forEach((p, index) => {
          let t = index / pointsList.length;
          ctx.beginPath(); ctx.arc(p.x, p.y, (waterSize + waterSize * t) / 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 150, 255, ${t * 0.5})`; ctx.fill();
        });
      });

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
