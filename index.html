    // --- motion_history / moving 相当の変数と関数 ---
    let motionHistory = [];

    function updateMotionHistory(currentRotated) {
      motionHistory.push(currentRotated);
      if (motionHistory.length > 30) motionHistory.shift();
    }

    function isMoving() {
      if (motionHistory.length < pointsLength) return [false, false, false, false];
      let answer = [];
      let recent = motionHistory.slice(-pointsLength);

      for (let finger = 0; finger < 4; finger++) {
        let pts = recent.map(f => f[finger]);
        let lineLength = Math.hypot(pts[pts.length - 1].x - pts[0].x, pts[pts.length - 1].y - pts[0].y);
        let speed = lineLength / pointsLength;

        let start = pts[0]; let end = pts[pts.length - 1];
        let baseLen = Math.hypot(end.x - start.x, end.y - start.y);
        let sumDist = 0;

        if (baseLen > 0) {
          pts.forEach(p => {
            let proj = ((p.x - start.x) * (end.x - start.x) + (p.y - start.y) * (end.y - start.y)) / baseLen;
            let closest = { 
              x: start.x + (end.x - start.x) * (proj / baseLen), 
              y: start.y + (end.y - start.y) * (proj / baseLen) 
            };
            sumDist += Math.hypot(closest.x - p.x, closest.y - p.y);
          });
        }
        let straightness = sumDist / pts.length;
        answer.push(speed > 4 && straightness < 3);
      }
      return answer;
    }

    // --- dtw / movie 相当のロジック ---
    const weights = [1.0, 1.0, 1.0, 0.7];
    let gestureTemplates = {};

    function frameDistance(frameA, frameB) {
      let sum = 0;
      for (let i = 0; i < 4; i++) {
        sum += Math.hypot(frameB[i].x - frameA[i].x, frameB[i].y - frameA[i].y) * weights[i];
      }
      return sum;
    }

    function multiDTW(seqA, seqB) {
      const n = seqA.length; const m = seqB.length;
      if (n === 0 || m === 0) return Infinity;
      let dp = Array.from({ length: n }, () => Array(m).fill(Infinity));
      dp[0][0] = frameDistance(seqA[0], seqB[0]);

      for (let i = 0; i < n; i++) {
        for (let j = 0; j < m; j++) {
          let cost = frameDistance(seqA[i], seqB[j]);
          if (i > 0) dp[i][j] = Math.min(dp[i][j], dp[i - 1][j] + cost);
          if (j > 0) dp[i][j] = Math.min(dp[i][j], dp[i][j - 1] + cost);
          if (i > 0 && j > 0) dp[i][j] = Math.min(dp[i][j], dp[i - 1][j - 1] + cost);
        }
      }
      return dp[n - 1][m - 1];
    }

    function normalizeSequence(sequence) {
      if (sequence.length === 0) return [];
      const base = sequence[0][0];
      let shifted = sequence.map(frame => frame.map(p => ({ x: p.x - base.x, y: p.y - base.y })));
      let maxDist = 0;
      shifted.forEach(frame => frame.forEach(p => {
        let dist = Math.hypot(p.x, p.y);
        if (dist > maxDist) maxDist = dist;
      }));
      if (maxDist === 0) return shifted;
      return shifted.map(frame => frame.map(p => ({ x: p.x / maxDist, y: p.y / maxDist })));
    }

    function predictGesture(rawSequence) {
      if (Object.keys(gestureTemplates).length === 0) return "テンプレートなし";
      const normalizedInput = normalizeSequence(rawSequence);
      let bestLabel = "判定不能"; let minScore = Infinity;
      for (let label in gestureTemplates) {
        let score = multiDTW(normalizedInput, gestureTemplates[label]);
        if (score < minScore) { minScore = score; bestLabel = label; }
      }
      return { label: bestLabel, score: minScore };
    }
