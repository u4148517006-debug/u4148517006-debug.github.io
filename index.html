<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>両手用流水キーボード - 1秒自動判定モード</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      background-color: #ffffff; font-family: sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    /* 📱 iPad横置き時の「画面上部」コントロールバー */
    #header-control {
      position: absolute; top: 0; left: 0; width: 100%; height: 50px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: flex-start;
      padding: 0 16px; box-sizing: border-box; z-index: 100; gap: 12px;
    }

    .btn {
      height: 36px; padding: 0 14px; color: white; border: none; border-radius: 6px; 
      font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15); cursor: pointer; touch-action: none;
    }
    #june-btn { background-color: #9C27B0; }
    #june-btn.active { background-color: #FF5722; }
    #fab { background-color: #4CAF50; }
    #fab.locked { background-color: #f44336; }
    
    /* 🕒 【新設】1秒モードボタン */
    #timer-mode-btn { background-color: #00bcd4; }
    #timer-mode-btn.active { background-color: #ff9800; animation: blink 1s infinite; }

    #ml-features {
      font-size: 13px; font-family: monospace; color: #333;
      margin-left: auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #status-badge {
      font-size: 11px; background: #eee; padding: 4px 8px; border-radius: 4px; font-weight: bold;
    }

    /* 🔤 【新設】画面中央上の判定結果表示エリア（分断線の真上） */
    #result-display {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; z-index: 90; text-align: center; font-weight: bold;
    }
    #res-kana { font-size: 72px; color: #1e88e5; line-height: 1.1; }
    #res-roma { font-size: 28px; color: #555; letter-spacing: 2px; }

    #odai-display {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-size: 140px; font-weight: bold; color: rgba(233, 30, 99, 0.15);
      pointer-events: none; z-index: 0; display: none;
    }

    /* 🎬 画面中央をきれいに真っ二つに分かつ縦の境界線 */
    #border-line {
      position: absolute; top: 50px; left: 50%; width: 2px; height: calc(100% - 50px);
      background: rgba(0, 0, 0, 0.15); pointer-events: none; z-index: 1;
    }

    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <div id="header-control">
    <button id="june-btn" class="btn">6月モード</button>
    <button id="fab" class="btn">🔓 ロック</button>
    <button id="timer-mode-btn" class="btn">⏱️ 1秒モード: OFF</button>
    
    <div id="ml-features" class="flex-center">待機中</div>
    <span id="status-badge">追従中</span>
  </div>

  <div id="result-display">
    <div id="res-kana"></div>
    <div id="res-roma"></div>
  </div>

  <canvas id="canvas"></canvas>
  <div id="border-line"></div>
  <div id="odai-display">あ</div>

  <script>

    ];
