<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>両手用流水キーボード - ひらがな判定完全修正版</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      background-color: #ffffff; font-family: sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    #header-control {
      position: absolute; top: 0; left: 0; width: 100%; height: 50px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: flex-start;
      padding: 0 16px; box-sizing: border-box; z-index: 100; gap: 12px;
    }

    .btn {
      height: 36px; padding: 0 14px; color: white; border: none; border-radius: 6px; 
      font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15); cursor: pointer; touch-action: none;
    }
    #fab { background-color: #4CAF50; }
    #fab.locked { background-color: #f44336; }
    #june-btn { background-color: #9C27B0; }
    #june-btn.active { background-color: #FF5722; }
    #timer-mode-btn { background-color: #00bcd4; }
    #timer-mode-btn.active { background-color: #ff9800; }

    #ml-features {
      font-size: 13px; font-family: monospace; color: #333;
      margin-left: auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #status-badge {
      font-size: 11px; background: #eee; padding: 4px 8px; border-radius: 4px; font-weight: bold;
    }

    /* 🎬 画面中央上の特大文字判定エリア */
    #result-display {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; z-index: 90; text-align: center; font-weight: bold;
      background: rgba(255, 255, 255, 0.95); padding: 14px 30px; border-radius: 12px;
      min-width: 390px; box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    }
    
    #res-signal { 
      font-size: 24px; font-weight: 900; margin-bottom: 4px; letter-spacing: 1px;
    }
    .signal-start { color: #4CAF50; }
    .signal-finish { color: #f44336; }

    /* ひらがな表示（青色で大きく目立たせる） */
    #res-kana { font-size: 90px; color: #1e88e5; font-family: sans-serif; line-height: 1; margin: 8px 0; min-height: 90px; }
    #res-roma { font-size: 24px; color: #444; font-family: monospace; letter-spacing: 2px; }

    #odai-display {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-size: 140px; font-weight: bold; color: rgba(233, 30, 99, 0.15);
      pointer-events: none; z-index: 0; display: none;
    }

    #border-line {
      position: absolute; top: 50px; left: 50%; width: 2px; height: calc(100% - 50px);
      background: rgba(0, 0, 0, 0.15); pointer-events: none; z-index: 1;
    }
  </style>
</head>
<body>

  <div id="header-control">
    <button id="june-btn" class="btn">6月モード</button>
    <button id="fab" class="btn">🔓 ロック</button>
    <button id="timer-mode-btn" class="btn">⏱️ 2秒モード: OFF</button>
    
    <div id="ml-features" class="flex-center">待機中</div>
    <span id="status-badge">追従中</span>
  </div>

  <div id="result-display">
    <div id="res-signal">-</div>
    <div id="res-kana"></div> 
    <div id="res-roma">2秒モードをONにしてください</div> 
  </div>

  <canvas id="canvas"></canvas>
  <div id="border-line"></div>
  <div id="odai-display">あ</div>

  <script>
    const GAS_URL = "";

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fab = document.getElementById('fab');
    const juneBtn = document.getElementById('june-btn');
    const timerModeBtn = document.getElementById('timer-mode-btn');
    const statusBadge = document.getElementById('status-badge');
    const mlFeaturesText = document.getElementById('ml-features');
    const odaiDisplay = document.getElementById('odai-display');
    const resSignal = document.getElementById('res-signal');
    const resKana = document.getElementById('res-kana');
    const resRoma = document.getElementById('res-roma');

    function resize() {
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 配置定数
    const keySize = 34; 
    const waterSize = 15;
    const stay = { x: 0, y: 0 };
    
    const moveUp = { x: keySize * -0.23, y: keySize * 2.2 };
    const moveDown = { x: keySize * 0.23, y: keySize * -2.2 };
    const moveLeft = { x: keySize * -2.14, y: 0 }; 
    const threeKeys = [stay, moveUp, moveDown, { x: moveUp.x * 2, y: moveUp.y * 2 }];
    const moveLeftForLeftHand = { x: keySize * 2.14, y: 0 }; 

    const rightKeysPositions = [
      [stay, moveUp, moveDown, moveLeft, { x: moveLeft.x + moveUp.x, y: moveLeft.y + moveUp.y }, { x: moveLeft.x + moveDown.x, y: moveLeft.y + moveDown.y }, { x: moveUp.x * 2, y: moveUp.y * 2 }], 
      threeKeys, threeKeys, threeKeys
    ];
    const leftKeysPositions = [
      threeKeys, threeKeys, threeKeys,
      [stay, moveUp, moveDown, moveLeftForLeftHand, { x: moveLeftForLeftHand.x + moveUp.x, y: moveLeftForLeftHand.y + moveUp.y }, { x: moveLeftForLeftHand.x + moveDown.x, y: moveLeftForLeftHand.y + moveDown.y }, { x: moveUp.x * 2, y: moveUp.y * 2 }] 
    ];

    const leftKeysNames = [
      ["A", "Q", "Z", "止"], ["S", "W", "X", "止"], ["D", "E", "C", "止"], ["F", "R", "V", "G", "T", "B", "止"]  
    ];
    const rightKeysNames = [
      ["J", "U", "M", "H", "Y", "N", "止"], ["K", "I", ",", "止"], ["L", "O", ".", "止"], [";", "P", "?", "止"]  
    ];

    // 🗺️ 完全網羅・ローマ字ひらがな変換テーブル
    const romaKanaMap = {
      "A": "あ", "I": "い", "U": "う", "E": "え", "O": "お",
      "KA":"か","KI":"き","KU":"く","KE":"け","KO":"こ",
      "SA":"さ","SI":"し","SU":"す","SE":"せ","SO":"そ",
      "TA":"た","TI":"ち","TU":"つ","TE":"て","TO":"と",
      "NA":"な","NI":"に","NU":"ぬ","NE":"ね","NO":"の",
      "HA":"は","HI":"ひ","HU":"ふ","HE":"へ","HO":"ほ",
      "MA":"ま","MI":"み","MU":"む","ME":"め","MO":"も",
      "YA":"や","YU":"ゆ","YO":"よ",
      "RA":"ら","RI":"り","RU":"る","RE":"れ","RO":"ろ",
      "WA":"わ","WO":"を","NN":"ん",
      "FA":"ふぁ","FI":"ふぃ","FE":"ふぇ","FO":"ふぉ"
    };

    const centerAdjust = [
      { x: keySize * -3.7, y: keySize * -0.2 }, { x: keySize * -1.3, y: keySize * -1.3 },
      { x: keySize * 1.3,  y: keySize * -1.3 }, { x: keySize * 3.5,  y: keySize * -0.2 }
    ];

    class Hand {
      constructor(isLeftHand) {
        this.isLeftHand = isLeftHand; 
        this.stableFingers = [];
        this.stableCenter = null;
        this.adjustedCenters = [];
        this.fourAngles = [];
        this.strokeStarts = [null, null, null, null];
        this.strokeEnds = [null, null, null, null];
        this.isTracking = false;
        this.hasPosition = false; 
      }
      clearStroke() {
        this.strokeStarts = [null, null, null, null];
        this.strokeEnds = [null, null, null, null];
        this.isTracking = false;
      }
    }

    let leftHand = new Hand(true);  
    let rightHand = new Hand(false); 
    let trails = {};
    let isLocked = false;

    let isJuneMode = false;
    let juneTimer = null;
    const odaiList = ["あ", "い", "う", "え", "お", "か", "き", "く", "け", "こ"];
    let odaiIndex = 0;
    let currentOdai = "";

    let isTimerMode = false;
    let timerTimeoutId = null; 
    let currentPhase = "START"; 

    function lerp(a, b, t) { return { x: a.x * (1 - t) + b.x * t, y: a.y * (1 - t) + b.y * t }; }
    function distance(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
    function archer(a, b) {
      let dis = distance(a, b);
      let speed = Math.pow(dis / (4.3 * keySize), 4) / 58;
      return lerp(a, b, speed > 5 ? 5 : speed);
    }

    function sortFingersAbsoluteX(pts) { return [...pts].sort((a, b) => a.x - b.x); }

    function circleCenterFrom2Points(a, b) {
      let vx = b.x - a.x; let vy = b.y - a.y;
      let r1 = { x: (vx * Math.cos(Math.PI*0.3) - vy * Math.sin(Math.PI*0.3)) * 1.35, y: (vx * Math.sin(Math.PI*0.3) + vy * Math.cos(Math.PI*0.3)) * 1.35 };
      let e1 = { x: a.x + r1.x, y: a.y + r1.y };
      return (e1.y > a.y) ? e1 : { x: a.x + (vx * Math.cos(-Math.PI*0.3) - vy * Math.sin(-Math.PI*0.3)) * 1.35, y: a.y + (vx * Math.sin(-Math.PI*0.3) + vy * Math.cos(-Math.PI*0.3)) * 1.35 };
    }

    function handleTouch(e) {
      let midX = canvas.width / 2; 
      let leftPoints = [];
      let rightPoints = [];
      let activeIds = new Set();

      Array.from(e.touches).forEach(t => {
        if (t.clientY < 50) return; 
        activeIds.add(t.identifier);
        let pt = { x: t.clientX, y: t.clientY };
        if (pt.x < midX) leftPoints.push(pt); else rightPoints.push(pt);

        if (!trails[t.identifier]) trails[t.identifier] = [];
        trails[t.identifier].push(pt);
        if (trails[t.identifier].length > 15) trails[t.identifier].shift();
      });

      if (!isLocked && leftPoints.length >= 4) {
        leftHand.isTracking = true; leftHand.hasPosition = true;
        let sorted = sortFingersAbsoluteX(leftPoints.slice(0, 4));
        if (leftHand.stableFingers.length === 0) leftHand.stableFingers = sorted.map(p => ({...p}));
        updateHandGeometry(leftHand, sorted);
      } 

      if (!isLocked && rightPoints.length >= 4) {
        rightHand.isTracking = true; rightHand.hasPosition = true;
        let sorted = sortFingersAbsoluteX(rightPoints.slice(0, 4));
        if (rightHand.stableFingers.length === 0) rightHand.stableFingers = sorted.map(p => ({...p}));
        updateHandGeometry(rightHand, sorted);
      }

      // 指トラッキング情報のキャプチャ
      if (leftHand.hasPosition && leftHand.stableFingers.length === 4) {
        let sorted = sortFingersAbsoluteX(leftPoints.length >= 4 ? leftPoints : Array.from(e.touches).filter(t => t.clientX < midX).map(t => ({x:t.clientX, y:t.clientY})));
        for(let i=0; i<4; i++) {
          let currentPt = sorted[i] || leftHand.stableFingers[i];
          if (!leftHand.strokeStarts[i]) leftHand.strokeStarts[i] = { ...currentPt };
          leftHand.strokeEnds[i] = { ...currentPt };
        }
      }
      if (rightHand.hasPosition && rightHand.stableFingers.length === 4) {
        let sorted = sortFingersAbsoluteX(rightPoints.length >= 4 ? rightPoints : Array.from(e.touches).filter(t => t.clientX >= midX).map(t => ({x:t.clientX, y:t.clientY})));
        for(let i=0; i<4; i++) {
          let currentPt = sorted[i] || rightHand.stableFingers[i];
          if (!rightHand.strokeStarts[i]) rightHand.strokeStarts[i] = { ...currentPt };
          rightHand.strokeEnds[i] = { ...currentPt };
        }
      }

      if (e.touches.length === 0 && !isTimerMode) {
        evaluateGlobalFlick();
        leftHand.clearStroke(); rightHand.clearStroke();
      }
      Object.keys(trails).forEach(id => { if (!activeIds.has(Number(id))) delete trails[id]; });
    }

    function updateHandGeometry(hand, realFingers) {
      let realCenter = circleCenterFrom2Points(realFingers[0], realFingers[3]);
      if (!hand.stableCenter) {
        hand.stableCenter = realCenter;
        hand.adjustedCenters = [realCenter, realCenter, realCenter, realCenter];
        let p = Math.atan2(hand.adjustedCenters[1].y - hand.stableFingers[1].y, hand.adjustedCenters[1].x - hand.stableFingers[1].x) + Math.PI / 2;
        hand.fourAngles = [p, p, p, p];
      }
      for (let i = 0; i < 4; i++) hand.stableFingers[i] = archer(hand.stableFingers[i], realFingers[i]);
      hand.stableCenter = archer(hand.stableCenter, realCenter);
      let centerAngle = Math.atan2(hand.stableFingers[1].y - hand.stableCenter.y, hand.stableFingers[1].x - hand.stableCenter.x) + Math.PI / 2;

      for (let i = 0; i < 4; i++) {
        let u = centerAdjust[i];
        hand.adjustedCenters[i] = { 
          x: hand.stableCenter.x + (u.x * Math.cos(centerAngle) - u.y * Math.sin(centerAngle)), 
          y: hand.stableCenter.y + (u.x * Math.sin(centerAngle) + u.y * Math.cos(centerAngle)) 
        };
        hand.fourAngles[i] = Math.atan2(hand.stableFingers[i].y - hand.adjustedCenters[i].y, hand.stableFingers[i].x - hand.adjustedCenters[i].x) + Math.PI / 2;
      }
    }

    function detectLetterFromPosition(isLeftHand, fingerIndex, rx, ry) {
      const positions = isLeftHand ? leftKeysPositions[fingerIndex] : rightKeysPositions[fingerIndex];
      const names = isLeftHand ? leftKeysNames[fingerIndex] : rightKeysNames[fingerIndex];
      if (!positions || !names) return "";

      let minDst = Infinity; let matchedIndex = 0;
      positions.forEach((offset, idx) => {
        let dst = Math.hypot(rx - offset.x, ry - offset.y);
        if (dst < minDst) { minDst = dst; matchedIndex = idx; }
      });
      return names[matchedIndex] || "";
    }

    // 🔍 【大修正】並び順（順不同）に囚われず、ひらがなを逆引きする完全堅牢ロジック
    function evaluateGlobalFlick() {
      let allMovements = [];
      
      [ { isLeft: true, label: "左", obj: leftHand }, { isLeft: false, label: "右", obj: rightHand } ].forEach(h => {
        if (!h.obj.hasPosition) return;
        for (let i = 0; i < 4; i++) {
          let start = h.obj.strokeStarts[i]; let end = h.obj.strokeEnds[i];
          if (!start || !end) continue;

          let totalDist = Math.hypot(end.x - start.x, end.y - start.y);
          let dx = end.x - h.obj.stableFingers[i].x;
          let dy = end.y - h.obj.stableFingers[i].y;
          let angle = h.obj.fourAngles[i];
          
          let rx = dx * Math.cos(angle) + dy * Math.sin(angle);
          let ry = dx * Math.sin(angle) - dy * Math.cos(angle);

          let matchedLetter = detectLetterFromPosition(h.isLeft, i, rx, ry);

          allMovements.push({
            isLeft: h.isLeft, fingerIndex: i, distance: totalDist,
            letter: matchedLetter
          });
        }
      });

      allMovements.sort((a, b) => b.distance - a.distance);
      let top2 = allMovements.slice(0, 2);

      if (top2.length > 0 && top2[0].distance > 10) {
        mlFeaturesText.innerHTML = top2.map((f, r) => `${r+1}位:${f.letter}(Δ:${f.distance.toFixed(0)})`).join(' | ');

        let let1 = top2[0].letter.replace(/止/g, "");
        let let2 = top2[1] && top2[1].distance > 10 ? top2[1].letter.replace(/止/g, "") : "";

        // 💥 【ここがキモ】順方向（let1 + let2）と逆方向（let2 + let1）の両方を生成してテスト！
        let patternA = let1 + let2;
        let patternB = let2 + let1;

        // マップからひらがなを抽出（どちらの順序でヒットしてもOK）
        let finalKana = romaKanaMap[patternA] || romaKanaMap[patternB] || "";

        // 単音（指1本だけの大きな動き）のケースもカバー
        if (!finalKana && romaKanaMap[let1]) {
          finalKana = romaKanaMap[let1];
        }

        // 🎬 中央インジケーターを書き換える
        resRoma.innerText = let2 ? `[ ${let1} ]  +  [ ${let2} ]` : `[ ${let1} ]`;
        resKana.innerText = finalKana; 

        if (isJuneMode) { sendToSpreadsheet(currentOdai, top2); }
      } else {
        resKana.innerText = "";
        resRoma.innerText = "（大きく動いた指なし）";
      }
    }

    // ⏱️ 2秒サイクル
    function runTimerSequence() {
      if (!isTimerMode) return;

      if (currentPhase === "START") {
        resSignal.innerText = "🟢 2秒カウント開始...";
        resSignal.className = "signal-start";
        
        [leftHand, rightHand].forEach(h => {
          for(let i=0; i<4; i++) {
            h.strokeStarts[i] = null; h.strokeEnds[i] = null;
          }
        });

        currentPhase = "FINISH";
        timerTimeoutId = setTimeout(runTimerSequence, 1000); 

      } else {
        resSignal.innerText = "🔴 FINISH（判定完了）";
        resSignal.className = "signal-finish";

        // 2秒経ったので判定
        evaluateGlobalFlick();

        currentPhase = "START";
        timerTimeoutId = setTimeout(runTimerSequence, 1000); 
      }
    }

    function stopTimerMode() {
      isTimerMode = false;
      if (timerTimeoutId) clearTimeout(timerTimeoutId);
      resSignal.innerText = "-"; resSignal.className = "";
      resKana.innerText = ""; resRoma.innerText = "2秒モードはオフです";
    }

    async function sendToSpreadsheet(char, top2Data) {
      if (!GAS_URL) return;
      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ char: char, top2: top2Data })
        });
      } catch (e) { console.error(e); }
    }

    window.addEventListener('touchstart', handleTouch);
    window.addEventListener('touchmove', (e) => { handleTouch(e); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchend', handleTouch);

    fab.addEventListener('touchstart', (e) => {
      e.stopPropagation(); 
      if (leftHand.hasPosition || rightHand.hasPosition) {
        isLocked = !isLocked;
        fab.className = isLocked ? "btn locked" : "btn";
        fab.innerText = isLocked ? "🔒 固定中" : "🔓 ロック";
        statusBadge.innerText = isLocked ? "位置固定" : "追従中";
        statusBadge.style.background = isLocked ? "#ffc107" : "#eee";
      }
    });

    timerModeBtn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      isTimerMode = !isTimerMode;
      if (isTimerMode) {
        timerModeBtn.className = "btn active";
        timerModeBtn.innerText = "⏱️ 2秒モード: ON";
        resRoma.innerText = "タイマー同期中..."; resKana.innerText = "";
        currentPhase = "START";
        runTimerSequence();
      } else {
        timerModeBtn.className = "btn";
        timerModeBtn.innerText = "⏱️ 2秒モード: OFF";
        stopTimerMode();
      }
    });

    juneBtn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      isJuneMode = !isJuneMode;
      if (isJuneMode) {
        juneBtn.className = "btn active"; odaiDisplay.style.display = "block";
        statusBadge.innerText = "6月モード"; statusBadge.style.background = "#e91e63"; statusBadge.style.color = "#fff";
        isLocked = true; fab.className = "btn locked"; fab.innerText = "🔒 固定中";
        odaiIndex = 0; nextOdai();
        juneTimer = setInterval(nextOdai, 1000);
      } else {
        juneBtn.className = "btn"; odaiDisplay.style.display = "none";
        statusBadge.innerText = "追従中"; statusBadge.style.background = "#eee"; statusBadge.style.color = "#000";
        isLocked = false; fab.className = "btn"; fab.innerText = "🔓 ロック";
        clearInterval(juneTimer);
      }
    });

    function nextOdai() {
      currentOdai = odaiList[odaiIndex]; odaiDisplay.innerText = currentOdai;
      odaiIndex = (odaiIndex + 1) % odaiList.length;
    }

    function drawHandKeyboard(hand, posPositions, namesList, color) {
      if (!hand.hasPosition || hand.stableFingers.length !== 4) return;
      ctx.strokeStyle = "rgba(128,128,128,0.25)"; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(hand.stableFingers[i].x, hand.stableFingers[i].y);
        ctx.lineTo(hand.adjustedCenters[i].x, hand.adjustedCenters[i].y); ctx.stroke();
      }
      for (let i = 0; i < 4; i++) {
        let pos = hand.stableFingers[i]; let angle = hand.fourAngles[i];
        ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.font = "11px sans-serif";
        ctx.fillText(`指${i}`, pos.x, pos.y - 42);

        posPositions[i].forEach((offset, m) => {
          let keyPos = { 
            x: pos.x + (offset.x * Math.cos(angle) + offset.y * Math.sin(angle)), 
            y: pos.y + (offset.x * Math.sin(angle) - offset.y * Math.cos(angle)) 
          };
          ctx.save(); ctx.translate(keyPos.x, keyPos.y); ctx.rotate(angle);
          ctx.fillStyle = "#ffffff"; ctx.strokeStyle = color; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect(-keySize, -keySize, keySize * 2, keySize * 2, 8); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#000000";
          let label = namesList[i][m] || "";
          ctx.font = `${m === namesList[i].length - 1 ? keySize/4 : keySize/2}px sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(label, 0, 0);
          ctx.restore();
        });
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawHandKeyboard(leftHand, leftKeysPositions, leftKeysNames, "rgba(33, 150, 243, 0.5)");
      drawHandKeyboard(rightHand, rightKeysPositions, rightKeysNames, "rgba(244, 67, 54, 0.5)");
      Object.values(trails).forEach(pointsList => {
        pointsList.forEach((p, index) => {
          let t = index / pointsList.length;
          ctx.beginPath(); ctx.arc(p.x, p.y, (waterSize + waterSize * t) / 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 150, 255, ${t * 0.4})`; ctx.fill();
        });
      });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
