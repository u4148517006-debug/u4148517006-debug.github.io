<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>両手用流水キーボード - 左右縦分割版</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      background-color: #ffffff; font-family: sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    /* 📱 iPad横置き時の「画面上部（長辺）」にコントロールを一列に配置 */
    #header-control {
      position: absolute; top: 0; left: 0; width: 100%; height: 50px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; box-sizing: border-box; z-index: 100;
    }

    .flex-left { display: flex; align-items: center; gap: 12px; }
    .flex-center { 
      font-size: 13px; font-family: monospace; line-height: 1.2; 
      color: #333; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .flex-right { display: flex; align-items: center; gap: 12px; }

    .btn {
      height: 36px; padding: 0 14px; color: white; border: none; border-radius: 6px; 
      font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15); cursor: pointer; touch-action: none;
    }
    #fab { background-color: #4CAF50; }
    #fab.locked { background-color: #f44336; }
    #june-btn { background-color: #9C27B0; }
    #june-btn.active { background-color: #FF5722; }

    #status-badge {
      font-size: 11px; background: #eee; padding: 4px 8px; border-radius: 4px; font-weight: bold;
    }

    /* 🍇 6月モードのお題（中央奥に特大表示） */
    #odai-display {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-size: 140px; font-weight: bold; color: rgba(233, 30, 99, 0.15);
      pointer-events: none; z-index: 0; display: none;
    }

    /* 🛠️ 【最重要】画面を左右に真っ二つに分かつ縦の境界線 */
    #border-line {
      position: absolute; top: 50px; left: 50%; width: 2px; height: calc(100% - 50px);
      background: rgba(0, 0, 0, 0.15); pointer-events: none; z-index: 1;
    }
  </style>
</head>
<body>

  <div id="header-control">
    <div class="flex-left">
      <button id="june-btn" class="btn">6月モード</button>
      <button id="fab" class="btn">🔓 ロック</button>
    </div>
    
    <div id="ml-features" class="flex-center">左半分に左手、右半分に右手を置いてください</div>
    
    <div class="flex-right">
      <span id="status-badge">追従中</span>
    </div>
  </div>

  <canvas id="canvas"></canvas>
  <div id="border-line"></div>
  <div id="odai-display">あ</div>

  <script>
    const GAS_URL = "";

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fab = document.getElementById('fab');
    const juneBtn = document.getElementById('june-btn');
    const statusBadge = document.getElementById('status-badge');
    const mlFeaturesText = document.getElementById('ml-features');
    const odaiDisplay = document.getElementById('odai-display');

    function resize() {
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 流水キーボードの幾何配置定数
    const keySize = 34; 
    const waterSize = 15;
    const stay = { x: 0, y: 0 };
    const moveUp = { x: keySize * -0.23, y: keySize * 2.2 };
    const moveDown = { x: keySize * 0.23, y: keySize * -2.2 };
    const moveLeft = { x: keySize * -2.14, y: 0 };
    const threeKeys = [stay, moveUp, moveDown, { x: moveUp.x * 2, y: moveUp.y * 2 }];

    // 【右手用配置】（親指/人差し指が左側、小指が右側）
    const rightKeysPositions = [
      [stay, moveUp, moveDown, moveLeft, { x: moveLeft.x + moveUp.x, y: moveLeft.y + moveUp.y }, { x: moveLeft.x + moveDown.x, y: moveLeft.y + moveDown.y }, { x: moveUp.x * 2, y: moveUp.y * 2 }], // 人差し指
      threeKeys, // 中指
      threeKeys, // 薬指
      threeKeys  // 小指
    ];
    const rightKeysNames = [
      ["J", "U", "M", "H", "Y", "N", "止"], ["K", "I", ",", "止"], ["L", "O", ".", "止"], [";", "P", "?", "止"]
    ];

    // 【左手用配置】（右手が鏡のように反転した完全対称。右側が人差し指で7キー、左に行くほど小指）
    const leftKeysPositions = [
      threeKeys, // 小指
      threeKeys, // 薬指
      threeKeys, // 中指
      [stay, moveUp, moveDown, moveLeft, { x: moveLeft.x + moveUp.x, y: moveLeft.y + moveUp.y }, { x: moveLeft.x + moveDown.x, y: moveLeft.y + moveDown.y }, { x: moveUp.x * 2, y: moveUp.y * 2 }] // 人差し指
    ];
    const leftKeysNames = [
      ["A", "Q", "Z", "止"], ["S", "W", "X", "止"], ["D", "E", "C", "止"], ["F", "R", "V", "G", "T", "B", "止"]
    ];

    const centerAdjust = [
      { x: keySize * -3.7, y: keySize * -0.2 },
      { x: keySize * -1.3, y: keySize * -1.3 },
      { x: keySize * 1.3,  y: keySize * -1.3 },
      { x: keySize * 3.5,  y: keySize * -0.2 }
    ];

    class Hand {
      constructor(isLeftHand) {
        this.isLeftHand = isLeftHand; // true: 左側半分, false: 右側半分
        this.stableFingers = [];
        this.stableCenter = null;
        this.adjustedCenters = [];
        this.fourAngles = [];
        this.strokeStarts = [null, null, null, null];
        this.strokeEnds = [null, null, null, null];
        this.isTracking = false;
      }
      reset() {
        this.stableFingers = [];
        this.stableCenter = null;
        this.adjustedCenters = [];
        this.fourAngles = [];
        this.strokeStarts = [null, null, null, null];
        this.strokeEnds = [null, null, null, null];
        this.isTracking = false;
      }
    }

    let leftHand = new Hand(true);  
    let rightHand = new Hand(false); 
    let trails = {};
    let isLocked = false;

    let isJuneMode = false;
    let juneTimer = null;
    const odaiList = ["あ", "い", "う", "え", "お", "か", "き", "く", "け", "こ"];
    let odaiIndex = 0;
    let currentOdai = "";

    function lerp(a, b, t) { return { x: a.x * (1 - t) + b.x * t, y: a.y * (1 - t) + b.y * t }; }
    function distance(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
    function archer(a, b) {
      let dis = distance(a, b);
      let speed = Math.pow(dis / (4.3 * keySize), 4) / 58;
      return lerp(a, b, speed > 5 ? 5 : speed);
    }

    // 🛠️ 【横並び特化】角度ソートアルゴリズム
    // 重心から見た各指の角度を並び替え、横画面（腕が下から伸びる状態）で破綻しないように配置
    function sortFingersHorizontally(pts, isLeftHand) {
      if (pts.length < 4) return pts;

      let cx = 0, cy = 0;
      pts.forEach(p => { cx += p.x; cy += p.y; });
      cx /= pts.length; cy /= pts.length;

      let ptsWithAngle = pts.map(p => {
        return { x: p.x, y: p.y, angle: Math.atan2(p.y - cy, p.x - cx) };
      });

      // 角度順（時計回り）に並び替える
      ptsWithAngle.sort((a, b) => a.angle - b.angle);

      // 横画面において、左手と右手で「小指〜人差し指」の物理的な並び順（左右）をマッピング
      if (isLeftHand) {
        // 左手：一番左が小指[0]、一番右（中央線寄り）が人差し指[3]
        return ptsWithAngle.map(p => ({ x: p.x, y: p.y }));
      } else {
        // 右手：一番左（中央線寄り）が人差し指[0]、一番右が小指[3]
        return ptsWithAngle.map(p => ({ x: p.x, y: p.y }));
      }
    }

    function circleCenterFrom2Points(a, b) {
      let vx = b.x - a.x; let vy = b.y - a.y;
      let r1 = { x: (vx * Math.cos(Math.PI*0.3) - vy * Math.sin(Math.PI*0.3)) * 1.35, y: (vx * Math.sin(Math.PI*0.3) + vy * Math.cos(Math.PI*0.3)) * 1.35 };
      let e1 = { x: a.x + r1.x, y: a.y + r1.y };
      return (e1.y > a.y) ? e1 : { x: a.x + (vx * Math.cos(-Math.PI*0.3) - vy * Math.sin(-Math.PI*0.3)) * 1.35, y: a.y + (vx * Math.sin(-Math.PI*0.3) + vy * Math.cos(-Math.PI*0.3)) * 1.35 };
    }

    function handleTouch(e) {
      let midX = canvas.width / 2; // 🎬 画面中央の縦境界線
      let leftPoints = [];
      let rightPoints = [];
      let activeIds = new Set();

      Array.from(e.touches).forEach(t => {
        if (t.clientY < 50) return; // 最上部メニューバーでの誤動作防止

        activeIds.add(t.identifier);
        let pt = { x: t.clientX, y: t.clientY };
        
        // 縦線（midX）を基準に「左半分（左手）」「右半分（右手）」に完全に仕分ける
        if (pt.x < midX) leftPoints.push(pt); else rightPoints.push(pt);

        if (!trails[t.identifier]) trails[t.identifier] = [];
        trails[t.identifier].push(pt);
        if (trails[t.identifier].length > 15) trails[t.identifier].shift();
      });

      // ーーー 左手領域（画面左側） ーーー
      if (!isLocked && leftPoints.length >= 4) {
        leftHand.isTracking = true;
        let sorted = sortFingersHorizontally(leftPoints.slice(0, 4), true);
        if (leftHand.stableFingers.length === 0) {
          leftHand.stableFingers = sorted.map(p => ({...p}));
          leftHand.strokeStarts = sorted.map(p => ({...p}));
        }
        leftHand.strokeEnds = sorted.map(p => ({...p}));
        updateHandGeometry(leftHand, sorted);
      } else if (isLocked && leftHand.stableFingers.length === 4 && leftPoints.length > 0) {
        let sorted = sortFingersHorizontally(leftPoints, true);
        leftHand.strokeEnds = leftHand.stableFingers.map((sf, idx) => sorted[idx] || sf);
      }

      // ーーー 右手領域（画面右側） ーーー
      if (!isLocked && rightPoints.length >= 4) {
        rightHand.isTracking = true;
        let sorted = sortFingersHorizontally(rightPoints.slice(0, 4), false);
        if (rightHand.stableFingers.length === 0) {
          rightHand.stableFingers = sorted.map(p => ({...p}));
          rightHand.strokeStarts = sorted.map(p => ({...p}));
        }
        rightHand.strokeEnds = sorted.map(p => ({...p}));
        updateHandGeometry(rightHand, sorted);
      } else if (isLocked && rightHand.stableFingers.length === 4 && rightPoints.length > 0) {
        let sorted = sortFingersHorizontally(rightPoints, false);
        rightHand.strokeEnds = rightHand.stableFingers.map((sf, idx) => sorted[idx] || sf);
      }

      if (e.touches.length === 0) {
        evaluateGlobalFlick();
        if (!isLocked) {
          leftHand.reset();
          rightHand.reset();
        }
      }

      Object.keys(trails).forEach(id => { if (!activeIds.has(Number(id))) delete trails[id]; });
    }

    function updateHandGeometry(hand, realFingers) {
      let realCenter = circleCenterFrom2Points(realFingers[0], realFingers[3]);
      if (!hand.stableCenter) {
        hand.stableCenter = realCenter;
        hand.adjustedCenters = [realCenter, realCenter, realCenter, realCenter];
        let p = Math.atan2(hand.adjustedCenters[1].y - hand.stableFingers[1].y, hand.adjustedCenters[1].x - hand.stableFingers[1].x) + Math.PI / 2;
        hand.fourAngles = [p, p, p, p];
      }

      for (let i = 0; i < 4; i++) hand.stableFingers[i] = archer(hand.stableFingers[i], realFingers[i]);
      hand.stableCenter = archer(hand.stableCenter, realCenter);
      let centerAngle = Math.atan2(hand.stableFingers[1].y - hand.stableCenter.y, hand.stableFingers[1].x - hand.stableCenter.x) + Math.PI / 2;

      for (let i = 0; i < 4; i++) {
        let u = centerAdjust[i];
        hand.adjustedCenters[i] = { 
          x: hand.stableCenter.x + (u.x * Math.cos(centerAngle) - u.y * Math.sin(centerAngle)), 
          y: hand.stableCenter.y + (u.x * Math.sin(centerAngle) + u.y * Math.cos(centerAngle)) 
        };
        hand.fourAngles[i] = Math.atan2(hand.stableFingers[i].y - hand.adjustedCenters[i].y, hand.stableFingers[i].x - hand.adjustedCenters[i].x) + Math.PI / 2;
      }
    }

    function evaluateGlobalFlick() {
      let allMovements = [];
      [ { label: "左手(L)", obj: leftHand }, { label: "右手(R)", obj: rightHand } ].forEach(h => {
        for (let i = 0; i < 4; i++) {
          let start = h.obj.strokeStarts[i]; let end = h.obj.strokeEnds[i];
          if (!start || !end) continue;

          let totalDist = Math.hypot(end.x - start.x, end.y - start.y);
          let dx = end.x - h.obj.stableFingers[i].x;
          let dy = end.y - h.obj.stableFingers[i].y;
          let angle = h.obj.fourAngles[i];
          let rx = dx * Math.cos(angle) + dy * Math.sin(angle);
          let ry = dx * Math.sin(angle) - dy * Math.cos(angle);

          allMovements.push({
            hand: h.label, fingerIndex: i, distance: totalDist,
            rx: parseFloat(rx.toFixed(1)), ry: parseFloat(ry.toFixed(1))
          });
        }
      });

      allMovements.sort((a, b) => b.distance - a.distance);
      let top2 = allMovements.slice(0, 2);

      if (top2.length > 0 && top2[0].distance > 15) {
        mlFeaturesText.innerHTML = top2.map((f, rank) => 
          `${rank+1}位: ${f.hand}-指${f.fingerIndex} (X:${f.rx}, Y:${f.ry})`
        ).join(' | ');
        
        if (isJuneMode) { sendToSpreadsheet(currentOdai, top2); }
      } else {
        mlFeaturesText.innerText = "待機中 / タップ検出";
      }
    }

    async function sendToSpreadsheet(char, top2Data) {
      if (!GAS_URL) return;
      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ char: char, top2: top2Data })
        });
      } catch (e) { console.error(e); }
    }

    window.addEventListener('touchstart', handleTouch);
    window.addEventListener('touchmove', (e) => { handleTouch(e); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchend', handleTouch);

    fab.addEventListener('touchstart', (e) => {
      e.stopPropagation(); 
      if (leftHand.stableFingers.length === 4 || rightHand.stableFingers.length === 4) {
        isLocked = !isLocked;
        fab.className = isLocked ? "btn locked" : "btn";
        fab.innerText = isLocked ? "🔒 固定中" : "🔓 ロック";
        statusBadge.innerText = isLocked ? "位置固定" : "追従中";
        statusBadge.style.background = isLocked ? "#ffc107" : "#eee";
      }
    });

    juneBtn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      isJuneMode = !isJuneMode;
      if (isJuneMode) {
        juneBtn.className = "btn active";
        odaiDisplay.style.display = "block";
        statusBadge.innerText = "6月モード";
        statusBadge.style.background = "#e91e63"; statusBadge.style.color = "#fff";
        isLocked = true;
        fab.className = "btn locked"; fab.innerText = "🔒 固定中";
        odaiIndex = 0; nextOdai();
        juneTimer = setInterval(nextOdai, 1000);
      } else {
        juneBtn.className = "btn";
        odaiDisplay.style.display = "none";
        statusBadge.innerText = "追従中";
        statusBadge.style.background = "#eee"; statusBadge.style.color = "#000";
        isLocked = false;
        fab.className = "btn"; fab.innerText = "🔓 ロック";
        clearInterval(juneTimer);
      }
    });

    function nextOdai() {
      currentOdai = odaiList[odaiIndex];
      odaiDisplay.innerText = currentOdai;
      odaiIndex = (odaiIndex + 1) % odaiList.length;
    }

    function drawHandKeyboard(hand, posPositions, namesList, color) {
      if (hand.stableFingers.length !== 4) return;

      ctx.strokeStyle = "rgba(128,128,128,0.25)"; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(hand.stableFingers[i].x, hand.stableFingers[i].y);
        ctx.lineTo(hand.adjustedCenters[i].x, hand.adjustedCenters[i].y); ctx.stroke();
      }

      for (let i = 0; i < 4; i++) {
        let pos = hand.stableFingers[i]; let angle = hand.fourAngles[i];
        
        ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.font = "11px sans-serif";
        ctx.fillText(`指${i}`, pos.x, pos.y - 42);

        posPositions[i].forEach((offset, m) => {
          let keyPos = { 
            x: pos.x + (offset.x * Math.cos(angle) + offset.y * Math.sin(angle)), 
            y: pos.y + (offset.x * Math.sin(angle) - offset.y * Math.cos(angle)) 
          };
          ctx.save(); ctx.translate(keyPos.x, keyPos.y); ctx.rotate(angle);
          ctx.fillStyle = "#ffffff"; ctx.strokeStyle = color; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect(-keySize, -keySize, keySize * 2, keySize * 2, 8); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#000000";
          let label = namesList[i][m] || "";
          ctx.font = `${m === namesList[i].length - 1 ? keySize/4 : keySize/2}px sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(label, 0, 0);
          ctx.restore();
        });
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawHandKeyboard(leftHand, leftKeysPositions, leftKeysNames, "rgba(33, 150, 243, 0.5)");
      drawHandKeyboard(rightHand, rightKeysPositions, rightKeysNames, "rgba(244, 67, 54, 0.5)");

      Object.values(trails).forEach(pointsList => {
        pointsList.forEach((p, index) => {
          let t = index / pointsList.length;
          ctx.beginPath(); ctx.arc(p.x, p.y, (waterSize + waterSize * t) / 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 150, 255, ${t * 0.4})`; ctx.fill();
        });
      });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
