<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4指マルチタッチ仮想キーボード</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      background-color: #ffffff;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block; width: 100vw; height: 100vh;
    }
    /* 録画ボタン（Floating Action Button風） */
    #fab {
      position: absolute; bottom: 24px; right: 24px;
      width: 56px; height: 56px; borderRadius: 28px;
      background-color: #2196F3; color: white;
      border: none; border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-size: 24px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10; touch-action: none;
    }
    #fab.recording { background-color: #f44336; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <button id="fab">●</button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fab = document.getElementById('fab');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 定数定義 (Flutterの定数を移植) ---
    const keySize = 41;
    const waterSize = 20;
    
    const stay = { x: 0, y: 0 };
    const moveUp = { x: keySize * -0.23, y: keySize * 2.2 };
    const moveDown = { x: keySize * 0.23, y: keySize * -2.2 };
    const moveLeft = { x: keySize * -2.14, y: 0 };
    
    const threeKeys = [stay, moveUp, moveDown, { x: moveUp.x * 2, y: moveUp.y * 2 }];
    const keysPositions = [
      [stay, moveUp, moveDown, moveLeft, { x: moveLeft.x + moveUp.x, y: moveLeft.y + moveUp.y }, { x: moveLeft.x + moveDown.x, y: moveLeft.y + moveDown.y }, { x: moveUp.x * 2, y: moveUp.y * 2 }],
      threeKeys, threeKeys, threeKeys
    ];

    const keysNames = [
      ["J", "U", "M", "H", "Y", "N", "Offset"], // index
      ["K", "I", ",", "Offset"],               // middle
      ["L", "O", ".", "Offset"],               // ring
      [";", "P", "?", "Offset"]                // small
    ];

    const centerAdjust = [
      { x: keySize * -3.7, y: keySize * -0.2 },
      { x: keySize * -1.3, y: keySize * -1.3 },
      { x: keySize * 1.3,  y: keySize * -1.3 },
      { x: keySize * 3.5,  y: keySize * -0.2 }
    ];

    // --- 状態管理変数 ---
    let touches = {};        // 現在タッチされている座標 { identifier: {x, y} }
    let trails = {};         // 軌跡エフェクト用データ { identifier: [{x, y}] }
    let motionHistory = [];  // 直近フレームの履歴（移動状態・速度判定用）
    const pointsLength = 4;

    let stableFingers = [];
    let stableCenter = null;
    let adjustedCenters = [];
    let fourAngles = [];
    let lineMovings = [false, false, false, false];

    let isRecording = false;
    let currentSequence = [];

    // --- 便利な数学ヘルパー関数 ---
    function lerp(a, b, t) { return { x: a.x * (1 - t) + b.x * t, y: a.y * (1 - t) + b.y * t }; }
    function distance(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
    
    function archer(a, b) {
      let dis = distance(a, b);
      let ratio = dis / (4.3 * keySize);
      let speed = Math.pow(ratio, 4) / 58;
      if (speed > 5) speed = 5;
      return lerp(a, b, speed);
    }

    function mean(pts) {
      let sum = pts.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
      return { x: sum.x / pts.length, y: sum.y / pts.length };
    }

    // 主軸を用いた指の並び替えロジック
    function sortByPrincipalAxis(pts) {
      const c = mean(pts);
      let sxx = 0, syy = 0, sxy = 0;
      pts.forEach(p => {
        let dx = p.x - c.x; let dy = p.y - c.y;
        sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
      });
      let theta = 0.5 * Math.atan2(2 * sxy, sxx - syy);
      let axis = { x: Math.cos(theta), y: Math.sin(theta) };

      return [...pts].sort((a, b) => {
        let da = (a.x - c.x) * axis.x + (a.y - c.y) * axis.y;
        let db = (b.x - c.x) * axis.x + (b.y - c.y) * axis.y;
        return da - db;
      });
    }

    function circleCenterFrom2Points(a, b) {
      let vx = b.x - a.x; let vy = b.y - a.y;
      function rotate(x, y, rad, c) {
        return {
          x: (x * Math.cos(rad) - y * Math.sin(rad)) * c,
          y: (x * Math.sin(rad) + y * Math.cos(rad)) * c
        };
      }
      let r1 = rotate(vx, vy, Math.PI * 0.3, 1.35);
      let r2 = rotate(vx, vy, -Math.PI * 0.3, 1.35);
      let e1 = { x: a.x + r1.x, y: a.y + r1.y };
      let e2 = { x: a.x + r2.x, y: a.y + r2.y };
      return (e1.y > a.y) ? e1 : e2;
    }

    // --- 直線度・速度計算 (moving.dartのWeb移植) ---
    function isMoving() {
      if (motionHistory.length < pointsLength) return [false, false, false, false];
      let answer = [];
      let recent = motionHistory.slice(-pointsLength);

      for (let finger = 0; finger < 4; finger++) {
        let pts = recent.map(f => f[finger]);
        let lineLength = distance(pts[0], pts[pts.length - 1]);
        let speed = lineLength / pointsLength;

        // 直線度の計算
        let start = pts[0]; let end = pts[pts.length - 1];
        let baseLen = distance(start, end);
        let sumDist = 0;
        if (baseLen > 0) {
          pts.forEach(p => {
            let proj = ((p.x - start.x) * (end.x - start.x) + (p.y - start.y) * (end.y - start.y)) / baseLen;
            let closest = { x: start.x + (end.x - start.x) * (proj / baseLen), y: start.y + (end.y - start.y) * (proj / baseLen) };
            sumDist += distance(p, closest);
          });
        }
        let straightness = sumDist / pts.length;
        answer.add = answer.push(speed > 4 && straightness < 3); // 閾値調整
      }
      return answer;
    }

    // --- タッチイベントリスナー (ListenerのWeb移植) ---
    function handleTouch(e) {
      let currentTouches = {};
      Array.from(e.touches).forEach(t => {
        currentTouches[t.identifier] = { x: t.clientX, y: t.clientY };
        
        // 軌跡エフェクト用データの蓄積
        if (!trails[t.identifier]) trails[t.identifier] = [];
        trails[t.identifier].push({ x: t.clientX, y: t.clientY });
        if (trails[t.identifier].length > 25) trails[t.identifier].shift();
      });
      touches = currentTouches;

      // タッチが離れた指の軌跡を消去
      Object.keys(trails).forEach(id => {
        if (!touches[id]) delete trails[id];
      });
    }

    window.addEventListener('touchstart', (e) => { handleTouch(e); });
    window.addEventListener('touchmove', (e) => { handleTouch(e); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchend', (e) => { handleTouch(e); });
    window.addEventListener('touchcancel', (e) => { handleTouch(e); });

    // 録画ボタンイベント
    fab.addEventListener('touchstart', (e) => {
      e.stopPropagation(); // 画面タッチと干渉させない
      isRecording = !isRecording;
      if (isRecording) {
        fab.className = "recording"; fab.innerText = "■";
        currentSequence = [];
      } else {
        fab.className = ""; fab.innerText = "●";
        console.log("--- 録画データ (JSON) ---", JSON.stringify(currentSequence));
      }
    });

    // --- メイン描画ループ (CustomPainter & FrameLoop) ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let points = Object.values(touches);

      if (points.length >= 4) {
        let sortedPoints = sortByPrincipalAxis(points);
        let realFingers = sortedPoints.slice(0, 4);
        let realCenter = circleCenterFrom2Points(realFingers[0], realFingers[3]);

        if (stableFingers.length === 0 || !stableCenter) {
          stableFingers = realFingers.map(p => ({...p}));
          stableCenter = realCenter;
          adjustedCenters = [stableCenter, stableCenter, stableCenter, stableCenter];
          let u = { x: adjustedCenters[1].x - stableFingers[1].x, y: adjustedCenters[1].y - stableFingers[1].y };
          let p = Math.atan2(u.y, u.x) + Math.PI / 2;
          fourAngles = [p, p, p, p];
        }

        // Archer追従補間
        for (let i = 0; i < 4; i++) {
          stableFingers[i] = archer(stableFingers[i], realFingers[i]);
        }
        stableCenter = archer(stableCenter, realCenter);

        let centerLine = { x: stableFingers[1].x - stableCenter.x, y: stableFingers[1].y - stableCenter.y };
        let centerAngle = Math.atan2(centerLine.y, centerLine.x) + Math.PI / 2;

        for (let i = 0; i < 4; i++) {
          let u = centerAdjust[i];
          let centerRotated = {
            x: u.x * Math.cos(centerAngle) - u.y * Math.sin(centerAngle),
            y: u.x * Math.sin(centerAngle) + u.y * Math.cos(centerAngle)
          };
          adjustedCenters[i] = { x: stableCenter.x + centerRotated.x, y: stableCenter.y + centerRotated.y };
        }

        for (let i = 0; i < 4; i++) {
          let u = { x: stableFingers[i].x - adjustedCenters[i].x, y: stableFingers[i].y - adjustedCenters[i].y };
          fourAngles[i] = Math.atan2(u.y, u.x) + Math.PI / 2;
        }

        // 座標履歴の更新と移動判定
        let currentRotated = [];
        for (let i = 0; i < 4; i++) {
          let angle = fourAngles[i];
          let np = { x: realFingers[i].x - stableFingers[i].x, y: realFingers[i].y - stableFingers[i].y };
          let rx = np.x * Math.cos(angle) + np.y * Math.sin(angle);
          let ry = np.x * Math.sin(angle) - np.y * Math.cos(angle);
          currentRotated.push({ x: rx, y: ry });
        }
        motionHistory.push(currentRotated);
        if (motionHistory.length > 30) motionHistory.shift();
        lineMovings = isMoving();

        if (isRecording) currentSequence.push(currentRotated);

        // --- 描画1: 指と中心をつなぐグレーの線 ---
        ctx.strokeStyle = "grey"; ctx.lineWidth = 3;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(stableFingers[i].x, stableFingers[i].y);
          ctx.lineTo(adjustedCenters[i].x, adjustedCenters[i].y);
          ctx.stroke();
        }

        // --- 描画2: 仮想キーボードの配置 ---
        for (let i = 0; i < 4; i++) {
          let pos = stableFingers[i];
          let angle = fourAngles[i];

          keysPositions[i].forEach((offset, m) => {
            let rotated = {
              x: offset.x * Math.cos(angle) + offset.y * Math.sin(angle),
              y: offset.x * Math.sin(angle) - offset.y * Math.cos(angle)
            };
            let keyPos = { x: pos.x + rotated.x, y: pos.y + rotated.y };

            // キー枠のレンダリング
            ctx.save();
            ctx.translate(keyPos.x, keyPos.y);
            ctx.rotate(angle);

            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#000000"; ctx.lineWidth = 3;
            
            // 四角キーの描画
            ctx.beginPath();
            ctx.roundRect(-keySize, -keySize, keySize * 2, keySize * 2, 10);
            ctx.fill(); ctx.stroke();

            // テキストの描画
            ctx.fillStyle = "#000000";
            let label = keysNames[i][m] || "";
            let fontSize = keySize / 2;
            if (m === keysNames[i].length - 1) {
              label = lineMovings[i] ? "動いてる" : "待機状態";
              fontSize = keySize / 4;
            }
            ctx.font = `${fontSize}px sans-serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, 0, 0);

            ctx.restore();
          });
        }

        // --- 描画3: 手首の大きなサークル ---
        if (stableCenter) {
          ctx.strokeStyle = "#000000"; ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(stableCenter.x, stableCenter.y, 150, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // --- 描画4: 流水エフェクト（指の動的な軌跡） ---
      Object.values(trails).forEach(pointsList => {
        pointsList.forEach((p, index) => {
          let t = index / pointsList.length;
          let radius = waterSize + waterSize * t;
          let isFingerMoving = lineMovings[0]; // 暫定で最初指のフラグ参照

          ctx.beginPath();
          ctx.arc(p.x, p.y, radius / 2, 0, Math.PI * 2);
          ctx.fillStyle = isFingerMoving ? `rgba(255, 0, 0, ${t * 0.5})` : `rgba(0, 150, 255, ${t * 0.5})`;
          ctx.fill();
        });
      });

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
